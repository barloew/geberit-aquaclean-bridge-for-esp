# Single source of truth for model / feature / route test status (Series 248, main branch).
# Read SCHEMA.md before editing. Hard rules:
#   - Everything that claims support elsewhere (README, docs, the overview image, release notes)
#     is derived from or checked against THIS file. Do not hand-write support claims elsewhere.
#   - status: validated is INVALID without a `validation` record carrying both bridge_release
#     and device_firmware. No evidence -> not validated.
#   - evidence references point to logs/captures by id only, never reverse-engineering
#     internals (those stay in the private store).

meta:
  branch: main              # Series 248 — classic AquaClean protocol
  status_vocab: [validated, supported, unsupported, planned, failed]
  # validated   = reproduced on real hardware, with a validation record (release + device fw)
  # supported   = the code supports it (feature discovery / public SAP cross-check); the user and
  #               their device are supported if they hit an issue. Not (yet) hardware-validated by us.
  # unsupported = the model/route does not have this surface, or is not supported
  # planned     = on the roadmap, not implemented
  # failed      = known broken / regressed (link an issue)

# Canonical test surfaces. The key is the stable ticket id half (e.g. sela/last_error).
surfaces:
  shower: "Shower start/stop"
  lady_shower: "Lady shower"
  dryer: "Dryer"
  odor_extraction: "Odor extraction"
  jet_strength: "Shower jet strength (levels)"
  arm_position: "Shower-arm position (levels)"
  water_temperature: "Water temperature (levels)"
  water_heating: "Water heating on/off"
  oscillation: "Oscillating spray"
  orientation_light: "Orientation light"
  auto_lid: "Automatic lid"
  flush: "Pre-flush / automatic flush"
  seat_heating: "Seat heating"
  descaling: "Descaling + shower-head cleaning"
  user_detection: "User detected / seated"
  last_error: "Error-code label (module-aware text)"
  profiles: "Bridge user profiles 1-6 (store / activate)"
  irk_recognition: "Automatic user recognition via IRK"
  remote_passthrough: "Remote control stays connected / keys pass through"

routes:
  native_api: "ESPHome native API route"
  mqtt: "MQTT route"
  homekit: "Apple HomeKit (optional, can run stand-alone)"

models:
  sela:
    name: "AquaClean Sela"
    series: 248
    sap_prefix: ["146.22"]
    status: validated
    validation: sela-hw     # -> validations[].id
    surfaces:
      shower: validated
      lady_shower: validated
      jet_strength: validated
      arm_position: validated
      water_temperature: validated
      water_heating: validated
      oscillation: validated
      orientation_light: validated
      descaling: validated
      user_detection: validated
      last_error: validated
      profiles: validated
      irk_recognition: validated
      remote_passthrough: validated
      # with Geberit's interface module (optional, from 2019); the validation Sela has no module:
      flush: supported
      # absent on the Sela (README: these exist on larger models):
      dryer: unsupported
      odor_extraction: unsupported
      auto_lid: unsupported
      seat_heating: unsupported

  mera-comfort:
    name: "AquaClean Mera Comfort"
    series: 248
    sap_prefix: ["146.21"]
    status: supported
    note: "Feature set resolved at runtime by feature discovery; not hardware-validated."

  mera-classic:
    name: "AquaClean Mera Classic"
    series: 248
    sap_prefix: ["146.20", "146.24"]   # 146.24 = floor-standing
    status: supported
    note: "Feature set resolved at runtime by feature discovery; not hardware-validated."

  tuma-comfort:
    name: "AquaClean Tuma Comfort"
    series: 248
    sap_prefix: ["146.27", "146.29", "146.31"]   # seat / complete system / floor-standing
    status: supported
    note: "Feature set resolved at runtime by feature discovery; not hardware-validated."

  tuma-classic:
    name: "AquaClean Tuma Classic"
    series: 248
    sap_prefix: ["146.07", "146.09", "146.32"]
    status: supported
    note: "Feature set resolved at runtime by feature discovery; not hardware-validated."

  cama:
    name: "AquaClean Cama"
    series: 248
    sap_prefix: ["146.34", "146.30"]   # 146.30 = test set
    status: supported
    note: "Feature set resolved at runtime by feature discovery; not hardware-validated."

  aquaclean-4000:
    name: "AquaClean 4000"
    series: 248
    sap_prefix: ["146.13"]
    status: unsupported
    note: "No app and no remote control, so the bridge cannot reach it. Listed for completeness."

# Bridge-level integration routes. Seeded from the README's claims for the Sela setup;
# demote any route you have not actually exercised on hardware to `supported`.
routes_status:
  native_api: { status: validated, validation: sela-hw }   # ESPHome native API — hardware-validated
  mqtt: { status: validated, validation: sela-hw-mqtt }       # hardware-validated (AtomS3 Lite + LilyGo)
  # Every image carries HomeKit; users enable it at runtime (homekit: runtime_toggle -> Apple Home switch).
  # Validated stand-alone and alongside both routes. Caveat: MQTT + HomeKit at once on a PSRAM-less board
  # runs the heap to ~5 KB (see sela-hw-hk-toggle and the lilygo board note). Prefer PSRAM for heavy use.
  homekit: { status: validated, validation: sela-hw }       # hardware-validated

# Hardware boards the firmware targets.
boards:
  m5stack-atoms3-lite: { status: validated, validation: sela-hw, note: "recommended; reference board" }
  m5stack-atoms3r: { status: builds, note: "builds, not yet tested on hardware. Has PSRAM — the board to prefer for MQTT + HomeKit at the same time." }
  xiao-esp32s3: { status: builds, note: "builds (also Plus), not yet tested on hardware" }
  esp32-s3-generic: { status: builds, note: "any ESP32-S3 with >=8 MB flash; builds, not yet tested on hardware" }
  lilygo-t-dongle-s3: { status: validated, validation: sela-hw-lilygo, note: "ESP32-S3, 16 MB flash, no PSRAM. Hardware-validated on a Sela. The T-Dongle-S3-Plus (8 MB PSRAM) needs a psram: block. HomeKit runs here too, but MQTT + HomeKit at the same time is tight on a board without PSRAM (lowest free heap ~5 KB during Apple Home pairing, log c67782f9) — it works, yet for heavy simultaneous use prefer a board with PSRAM (e.g. AtomS3R)." }

# Evidence records. A `validated` status must reference one of these.
validations:
  # v1.38.0 adds the web-installer /maintenance consent page and entity-icon corrections. The BLE / MQTT /
  # HomeKit paths are unchanged, so the earlier validations carry forward; the /maintenance consent + show flow
  # is itself hardware-validated on 2026-11-26 (see sela-hw-maintenance).
  # v1.37.0 differs from v1.36.0 only in the MQTT per-profile entity naming (issue #10), re-validated on
  # hardware on 2026-11-25 (LilyGo + MQTT; see sela-hw-lilygo / sela-hw-mqtt). The native-API and HomeKit
  # firmware is byte-identical to v1.36.0, so those hardware validations carry forward unchanged.
  - id: sela-hw
    model: sela
    status: validated
    bridge_release: "v1.38.0"
    device_firmware: "RS08 TS57"      # main control node; BT node 10.18; remote 3.60.101.900/0001
    by: "maintainer"
    evidence: "AquaClean Sela on an AtomS3 Lite (GigaDevice flash): a toilet error reproduced and labelled (log 8fe51613); native API + HomeKit validated on hardware (HomeKit started, Ed25519 selftest OK, accessory paired) and the toilet connected with the stored pairing key, model 146.22x.xx.1 / firmware RS08 TS57 read out. Re-confirmed on v1.38.0 (log 205b3aaf): same AtomS3 Lite, native API + HomeKit (4 controllers), connected to the toilet and model 146.22x.xx.1 / firmware RS08 TS57 read out."
  - id: sela-hw-lilygo
    model: sela
    status: validated
    bridge_release: "v1.37.0"
    device_firmware: "RS08 TS57"
    by: "maintainer"
    evidence: "AquaClean Sela on a LilyGo T-Dongle-S3 over the MQTT route (log ac96e325): paired as remote in the toilet's pairing window, Connected to the toilet, feature discovery = AquaClean Sela, model 146.22x.xx.1 / serial MB2507EU205983 read out, settings and status polled (RSSI -54..-78). Re-validated on v1.37.0 (2026-11-25): same LilyGo over the MQTT route, paired as remote, Connected to the toilet, feature discovery = AquaClean Sela, and user profiles 1–3 read out as separate per-profile entities with their own values (issue #10 fix confirmed on hardware)."
  - id: sela-hw-mqtt
    model: sela
    status: validated
    bridge_release: "v1.37.0"
    device_firmware: "RS08 TS57"
    by: "maintainer"
    evidence: "MQTT route hardware-validated on a Sela over MQTT discovery: AtomS3 Lite (connected to the toilet; model, firmware RS08 TS57 and settings read out; all entities published) and LilyGo T-Dongle-S3 (log ac96e325). All prior MQTT and native-api validation ran on the AtomS3 Lite. v1.37.0 adds the per-profile MQTT topics (issue #10): confirmed on hardware (2026-11-25, LilyGo) — user profiles 1–6 publish on their own topics instead of sharing one per setting with the session."
  - id: sela-hw-hk-toggle
    model: sela
    status: validated
    bridge_release: "v1.37.0"
    device_firmware: "RS08 TS57"
    by: "maintainer"
    evidence: "Runtime HomeKit toggle (the 'Apple Home' switch, homekit: runtime_toggle) validated on hardware. AtomS3 Lite over the native API; LilyGo T-Dongle-S3 with MQTT + web server + HomeKit running together (logs cffca608, c67782f9). On the LilyGo the switch started HomeKit live, the state persisted across the MQTT-connect reboot and HomeKit restarted by itself, and a full Apple Home pairing (4 controllers) completed with MQTT connected. No-PSRAM heap floor during simultaneous MQTT + HomeKit + pairing: lowest free ~5.1 KB, largest block ~10 KB — works, but no headroom for a third concurrent heavy task."
  - id: sela-hw-maintenance
    model: sela
    status: validated
    bridge_release: "v1.38.0"
    device_firmware: "RS08 TS57"
    by: "maintainer"
    evidence: "Web-installer physical-maintenance consent validated on a Sela (AtomS3 Lite, native-API route with HomeKit, 2026-11-26, log 205b3aaf). The /maintenance page is served on the normal LAN web UI; accepting it stored the consent and it persisted (a second POST is refused — permanent until factory reset). After pairing the ESP as remote, a long-press of the maintenance key showed the full physical-maintenance entity set (descaling, arm cleaning, calibration, drain, offsets) and Home Assistant reloaded to pick them up; a factory reset cleared the stored consent. The entity-icon corrections (seated, dryer-temperature and seat-heating numbers) ride along in the same build. Note: the maintenance entities are still shown by toggling `internal` at runtime, which ESPHome flags as deprecated (removed in 2027.3.0) — tracked for a follow-up, not a regression in this release."

# Device-independent, CI-verified checks. NOT hardware validations: no device_firmware, not tied to
# any model, and never shown as "tested on hardware". Kept separate on purpose.
build_checks:
  languages:
    count: 29
    status: structural            # identical key structure across all language files
    check: "tools/check_lang_keys.py"
    note: "Present and structurally consistent (CI). Translation quality is not all native-reviewed; a native pass on long-tail languages is welcome."

# Ledger of AquaClean device firmware versions seen in the field.
# An unseen device firmware is treated as `untested` (may break our code) until a validation
# record covers it — this is the Geberit-OTA break-vector early-warning.
device_firmware_seen:
  "RS08 TS57":
    model: sela
    status: known-good
    bridge_release: "v1.38.0"
    note: "BT node 10.18; remote 3.60.101.900/0001"
