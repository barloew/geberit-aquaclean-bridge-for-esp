name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lang-keys:
    name: Translation keys match en.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/check_lang_keys.py

  yamllint:
    name: Lint translation YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pipx install yamllint
      - run: yamllint -c .yamllint components/geberit_aquaclean/lang

  ruff:
    name: Ruff (Python component)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff@0.15.16 check components/geberit_aquaclean tools

  overview:
    name: Overview infographic is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml fonttools
      - run: python3 tools/overview/generate.py --check

  clang-format:
    name: clang-format (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check formatting
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          # Our own sources only — skip vendored qrcodegen and the HomeKit SDK.
          mapfile -t FILES < <(find components/geberit_aquaclean \
            \( -name '*.cpp' -o -name '*.h' \) ! -name 'qrcodegen.*')
          echo "Checking ${#FILES[@]} files"
          clang-format --dry-run --Werror "${FILES[@]}"

  esphome-config:
    name: esphome config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        route: [api, mqtt]
        board: [atoms3-lite, atoms3r, xiao-esp32s3]
        language: [en, nl, de]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome==2026.10.2
      - name: Validate config
        run: esphome config firmware/aquaclean-${{ matrix.route }}-${{ matrix.board }}-${{ matrix.language }}.yaml
