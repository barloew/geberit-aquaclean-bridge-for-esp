# Builds the ready-made firmware (MQTT route, one per board and language) and publishes the web installer on
# GitHub Pages. Enable Pages with source "GitHub Actions" in the repository settings.
# Generated by tools/gen_firmware.py; change that script, not this file.
name: Build firmware and web installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [atoms3-lite, atoms3r, xiao-esp32s3]
        language: [en, nl, de, fr, it, es, pl, cs, hu, da, sv, nb, fi, pt, ar, tr, et, hr, lv, lt, ro, ru, sk, sl, sr, uk, zh, ko, he]
    steps:
      - uses: actions/checkout@v4
      - uses: esphome/build-action@v7
        id: esphome
        with:
          yaml-file: firmware/aquaclean-${{ matrix.board }}-${{ matrix.language }}.yaml
          version: "2026.10.2"
          complete-manifest: true
      - name: Collect
        run: |
          mkdir -p out/${{ matrix.board }}/${{ matrix.language }}
          cp -r "${{ steps.esphome.outputs.name }}"/* out/${{ matrix.board }}/${{ matrix.language }}/
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}-${{ matrix.language }}
          path: out

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble site
        run: |
          mkdir -p site/firmware
          cp static/index.html static/boards.json site/
          cp -r static/series-250 site/series-250
          for d in artifacts/firmware-*; do cp -r "$d"/* site/firmware/; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
