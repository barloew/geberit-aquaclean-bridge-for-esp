name: Claude

# PR-only on this branch: mention @claude in a PR review or review comment.
# New issues and @claude in issue comments are handled repo-wide by the workflows on the
# default branch (main), so they are intentionally not duplicated here.
# Uses the repo secret ANTHROPIC_API_KEY and the Claude GitHub App (both repo-wide).

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    if: >-
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
