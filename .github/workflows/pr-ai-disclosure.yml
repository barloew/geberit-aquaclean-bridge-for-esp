name: PR AI disclosure

# Requires every PR to declare whether AI wrote or helped write it. Satisfy it either way:
#   * a repository label "ai: none|assisted|generated" (one click; needs write access, so maintainers
#     and triagers), or
#   * an "AI-Assistance: none|assisted|generated" line in the PR description (works for everyone,
#     including PRs from forks).
# See the PR template.
#
# The PR body and label names are passed in as environment variables (not read from
# github.event_path, which can arrive empty, and never interpolated into the shell), so the check
# needs no checkout and no secrets. Uses pull_request (not pull_request_target): it reads only the
# body and labels, so it needs none of pull_request_target's elevated context, and pull_request
# sidesteps GitHub's 2026-12-02 default restriction on pull_request_target for public repositories.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require AI-assistance disclosure
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          try:
              labels = json.loads(os.environ.get("PR_LABELS") or "[]")
          except Exception:
              labels = []
          body = os.environ.get("PR_BODY") or ""
          # 1) a label like "ai: generated" — one click, for maintainers/triagers
          label_re = re.compile(r"(?i)^\s*ai(?:[-\s]?assistance)?\s*[:\-]\s*(none|assisted|generated)\s*$")
          for name in labels:
              m = label_re.match(name or "")
              if m:
                  print(f"OK (label): {m.group(1).lower()}")
                  sys.exit(0)
          # 2) a line in the PR description — works for everyone, including fork PRs
          m = re.search(r"(?im)^\s*AI-Assistance:\s*(none|assisted|generated)\b", body)
          if m:
              print(f"OK (body): {m.group(1).lower()}")
              sys.exit(0)
          print("::error::Declare AI assistance: add a label 'ai: none|assisted|generated' "
                "(maintainers), or an 'AI-Assistance: none|assisted|generated' line in the PR "
                "description (works for fork PRs). See the PR template.")
          sys.exit(1)
          PY
