# Declarative repo labels, synced by .github/workflows/labels.yml.
- name: bug
  color: d73a4a
  description: Something is broken
- name: enhancement
  color: a2eeef
  description: New capability or improvement
- name: new-model
  color: 0e8a16
  description: Request to support another AquaClean model
- name: needs-triage
  color: fbca04
  description: Awaiting first review
- name: question
  color: d876e3
  description: Usage question (better suited to Discussions)
- name: alba
  color: 5319e7
  description: Concerns the experimental Alba firmware (series-250-bridge branch)
- name: field-test
  color: 006b75
  description: Field test report against the standard test plan
- name: native-api
  color: c2e0c6
  description: Route — ESPHome native API
- name: mqtt
  color: c2e0c6
  description: Route — MQTT
# Consumer platform (set by the triage bot from the issue form)
- name: home-assistant
  color: d4c5f9
  description: Platform — Home Assistant
- name: homey
  color: d4c5f9
  description: Platform — Homey
- name: iobroker
  color: d4c5f9
  description: Platform — ioBroker
- name: openhab
  color: d4c5f9
  description: Platform — openHAB
- name: node-red
  color: d4c5f9
  description: Platform — Node-RED
- name: domoticz
  color: d4c5f9
  description: Platform — Domoticz
- name: homekit
  color: d4c5f9
  description: Platform — Apple Home / HomeKit
# PR path labels (actions/labeler)
- name: documentation
  color: 0075ca
  description: Docs / README / CHANGELOG
- name: translations
  color: c5def5
