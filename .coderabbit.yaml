# CodeRabbit configuration. Docs: https://docs.coderabbit.ai/guides/configure-coderabbit
language: en
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/homekit_sdk/**"
    - "!**/qrcodegen.*"
    - "!**/node_modules/**"
    - "!components/geberit_aquaclean/lang/log/**"
    - "!firmware/**/*.yaml" # generated by tools/gen_firmware.py (but review Alba firmware/*.c|h on series-250-bridge)
  path_instructions:
    - path: "components/geberit_aquaclean/**/*.{cpp,h}"
      instructions: >-
        This is an ESPHome external component for ESP32-S3 on the Bluedroid BLE stack. Flag blocking or
        long-running work in the main loop or in BLE callbacks, unbounded or unchecked buffers, and
        reentrancy in GATT notification handlers. Entity key strings must be US English and must match the
        keys used in components/geberit_aquaclean/lang/*.yaml.
    - path: "components/geberit_aquaclean/__init__.py"
      instructions: >-
        ESPHome Python config. Every entity key defined here must exist in every language file under lang/.
    - path: "components/geberit_aquaclean/lang/*.yaml"
      instructions: >-
        Translation files. Each must have exactly the same keys as en.yaml; only the values are translated.
        Flag any added, removed or renamed key that does not also change en.yaml and all other languages.
    - path: "docs/**"
      instructions: >-
        Do not suggest adding the Series 250 / "Arendi" protocol internals here; that documentation is kept
        private by the author and must not land in the public repository.
    - path: "firmware/**/*.{c,h}"
      instructions: >-
        On the series-250-bridge branch this is a dual-role ESP-IDF / NimBLE firmware for the Series 250 Alba
        (protocol v2). Flag blocking work in BLE GATT callbacks, missing bounds checks when parsing incoming
        frames, and any mishandling of crypto/key material. Do not propose moving protocol internals into public docs.

chat:
  auto_reply: true
