<svg xmlns="http://www.w3.org/2000/svg" width="280" height="236" viewBox="0 0 280 236" role="img" aria-label="Step 6: Pair toilet, remote and app">
  <style>
    .box   { fill:#ffffff; stroke:#d0d7de; }
    .chip  { fill:#2f81f7; fill-opacity:.12; }
    .icon  { stroke:#2f81f7; }
    .sub   { font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; letter-spacing:.08em; fill:#2f81f7; }
    .title { font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill:#1f2328; }
    .text  { font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill:#59636e; }
    @media (prefers-color-scheme: dark) {
      .box   { fill:#0d1117; stroke:#3d444d; }
      .chip  { fill-opacity:.22; }
      .title { fill:#f0f6fc; }
      .text  { fill:#9198a1; }
    }
  </style>
  <rect class="box" x="1" y="1" width="278" height="234" rx="16" stroke-width="1.5"/>
  <rect class="chip" x="24" y="24" width="44" height="44" rx="11"/>
  <g class="icon" transform="translate(34 34)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
  </g>
  <text x="24" y="94" class="sub">STEP 6</text>
  <text x="24" y="120" class="title">Pair toilet, remote</text>
  <text x="24" y="143" class="title">and app</text>
  <text x="24" y="168" class="text">Pair the bridge with the toilet,</text>
  <text x="24" y="186" class="text">then the remote control, then the</text>
  <text x="24" y="204" class="text">Geberit Home app.</text>
