# LilyGo T-Dongle-S3 (ESP32-S3, 16 MB flash, no PSRAM): APA102 RGB LED on GPIO40 (data) / GPIO39 (clock),
# BOOT button on GPIO0.
#
# RGB status LED (same meaning as the AtomS3 Lite):
#   green = toilet connected, blue = app connected, cyan = remote control connected,
#   purple blinking = pairing window, red blinking = no connection to the toilet,
#   two bright blinks in the user's color = user recognized, profile loaded (welcome light).
# Button (BOOT): hold 3 s = pair the ESP with the toilet as remote control (then switch the toilet off and on).
#
# This is the standard T-Dongle-S3 (no PSRAM). For the T-Dongle-S3-Plus (8 MB OPI PSRAM) add:
#   psram:
#     mode: octal
#     speed: 80MHz

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    # Optional IRAM saving for a self-build (NOT enabled by default, so the web-installer image makes no
    # assumption about a unit's flash vendor): the tested unit's flash is Winbond and its IRAM was at 100%
    # (ESPHome logged "Set flash_chip: winbond ... to save IRAM"). Uncomment to pin it; if your unit's build
    # log names a different vendor, use that value instead.
    # advanced:
    #   flash_chip: winbond
    # Same as the other boards: Bluetooth and Wi-Fi need internal RAM; keep Wi-Fi code out of IRAM to free heap.
    sdkconfig_options:
      CONFIG_ESP_WIFI_IRAM_OPT: n
      CONFIG_ESP_WIFI_RX_IRAM_OPT: n
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "6"

# APA102 RGB LED on its own SPI bus (shared with nothing else here; the LCD, if fitted, uses a separate bus).
spi:
  - id: spi_led
    clk_pin: GPIO39
    mosi_pin: GPIO40

light:
  - platform: spi_led_strip
    id: aquaclean_status_led
    name: Status LED
    spi_id: spi_led
    num_leds: 1
    data_rate: 1MHz
    internal: true
    default_transition_length: 0s
    # spi_led_strip has no rgb_order option: it assumes BGR, which is exactly what this dongle's APA102 uses,
    # so the status colors come out correct. Do not add rgb_order (no such key -> build error).

binary_sensor:
  - platform: gpio
    id: aquaclean_board_button
    internal: true
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    on_multi_click:
      - timing:
          - ON for at least 3s
        then:
          - lambda: id(aquaclean).button_action(esphome::geberit_aquaclean::BTN_PAIR_AS_REMOTE);

interval:
  - interval: 100ms
    then:
      - lambda: |-
          static uint32_t tick = 0;
          tick++;
          const bool blink = (tick / 5) % 2 == 0;
          auto *hub = id(aquaclean);
          auto *link = hub->link();
          float r = 0, g = 0, b = 0;
          static float last = -1;
          float wr, wg, wb;
          const bool welcome = hub->welcome_led(wr, wg, wb);
          float brightness = 0.25;
          if (welcome) {
            r = wr; g = wg; b = wb;
            brightness = 1.0;
          } else if (link != nullptr && link->is_pairing()) {
            if (blink) { r = 0.6; b = 1.0; }
          } else if (!hub->is_ready()) {
            if (blink) { r = 1.0; }
          } else if (hub->app_connected()) {
            b = 1.0;
          } else if (link != nullptr && link->remote_connected()) {
            g = 0.8; b = 0.8;
          } else {
            g = 1.0;
          }
          // only send a change to the LED
          const float key = r * 1000000 + g * 10000 + b * 100 + brightness;
          if (key == last)
            return;
          last = key;
          auto call = id(aquaclean_status_led).make_call();
          if (r == 0 && g == 0 && b == 0) {
            call.set_state(false);
          } else {
            call.set_state(true);
            call.set_brightness(brightness);
            call.set_rgb(r, g, b);
          }
          call.set_transition_length(0);
          call.perform();
