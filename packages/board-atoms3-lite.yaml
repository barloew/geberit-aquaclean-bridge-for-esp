# M5Stack AtomS3 Lite (ESP32-S3FN8, 8 MB flash): RGB status LED on GPIO35, button on GPIO41.
#
# LED: green = toilet connected, blue = app connected, cyan = remote control connected,
#      purple blinking = pairing window, red blinking = no connection to the toilet,
#      two bright blinks in the user's color = user recognized, profile loaded (welcome light).
# Button: hold 3 s = pair the ESP with the toilet as remote control (then switch the toilet off and on).

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    # More free RAM (no PSRAM on this board): on the ESP32-S3 code in IRAM comes out of the same RAM as the heap.
    # Wi-Fi code from flash instead of IRAM (-18 KB IRAM, measured) and 6 instead of 10 static receive buffers
    # (-6 KB); slightly lower Wi-Fi throughput, which this device does not need.
    sdkconfig_options:
      CONFIG_ESP_WIFI_IRAM_OPT: n
      CONFIG_ESP_WIFI_RX_IRAM_OPT: n
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "6"

light:
  - platform: esp32_rmt_led_strip
    id: aquaclean_status_led
    name: Status LED
    pin: GPIO35
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    internal: true
    default_transition_length: 0s

binary_sensor:
  - platform: gpio
    id: aquaclean_board_button
    internal: true
    pin:
      number: GPIO41
      inverted: true
      mode:
        input: true
        pullup: true
    on_multi_click:
      - timing:
          - ON for at least 3s
        then:
          - lambda: id(aquaclean).button_action(esphome::geberit_aquaclean::BTN_PAIR_AS_REMOTE);

interval:
  - interval: 100ms
    then:
      - lambda: |-
          static uint32_t tick = 0;
          tick++;
          const bool blink = (tick / 5) % 2 == 0;
          auto *hub = id(aquaclean);
          auto *link = hub->link();
          float r = 0, g = 0, b = 0;
          static float last = -1;
          float wr, wg, wb;
          const bool welcome = hub->welcome_led(wr, wg, wb);
          float brightness = 0.25;
          if (welcome) {
            r = wr; g = wg; b = wb;
            brightness = 1.0;
          } else if (link != nullptr && link->is_pairing()) {
            if (blink) { r = 0.6; b = 1.0; }
          } else if (!hub->is_ready()) {
            if (blink) { r = 1.0; }
          } else if (hub->app_connected()) {
            b = 1.0;
          } else if (link != nullptr && link->remote_connected()) {
            g = 0.8; b = 0.8;
          } else {
            g = 1.0;
          }
          // only send a change to the LED
          const float key = r * 1000000 + g * 10000 + b * 100 + brightness;
          if (key == last)
            return;
          last = key;
          auto call = id(aquaclean_status_led).make_call();
          if (r == 0 && g == 0 && b == 0) {
            call.set_state(false);
          } else {
            call.set_state(true);
            call.set_brightness(brightness);
            call.set_rgb(r, g, b);
          }
          call.set_transition_length(0);
          call.perform();
