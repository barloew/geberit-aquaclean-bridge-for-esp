                tz.dst_end = {14400, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 19:  // Europe/Vilnius: EET-2EEST,M3.5.0/3,M10.5.0/4
                tz.std_offset_seconds = -7200;
                tz.dst_offset_seconds = -10800;
                tz.dst_start = {10800, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
                tz.dst_end = {14400, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 20:  // Europe/Warsaw: CET-1CEST,M3.5.0,M10.5.0/3
                tz.std_offset_seconds = -3600;
                tz.dst_offset_seconds = -7200;
                tz.dst_start = {7200, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
                tz.dst_end = {10800, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 21:  // Europe/Prague: CET-1CEST,M3.5.0,M10.5.0/3
                tz.std_offset_seconds = -3600;
                tz.dst_offset_seconds = -7200;
                tz.dst_start = {7200, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
                tz.dst_end = {10800, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 22:  // Europe/Bratislava: CET-1CEST,M3.5.0,M10.5.0/3
                tz.std_offset_seconds = -3600;
                tz.dst_offset_seconds = -7200;
                tz.dst_start = {7200, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
