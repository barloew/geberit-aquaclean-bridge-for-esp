      - Europe/Oslo
      - Europe/Stockholm
      - Europe/Helsinki
      - Europe/Tallinn
      - Europe/Riga
      - Europe/Vilnius
      - Europe/Warsaw
      - Europe/Prague
      - Europe/Bratislava
      - Europe/Budapest
      - Europe/Ljubljana
      - Europe/Zagreb
      - Europe/Belgrade
      - Europe/Bucharest
      - Europe/Sofia
      - Europe/Athens
      - Europe/Istanbul
      - Europe/Kyiv
      - Europe/Moscow
      - Asia/Jerusalem
      - Asia/Riyadh
      - Asia/Dubai
      - Asia/Shanghai
      - Asia/Hong_Kong
      - Asia/Singapore
      - Asia/Seoul
      - Asia/Tokyo
      - Australia/Perth
      - Australia/Sydney
      - Pacific/Auckland
      - Africa/Johannesburg
      - America/New_York
      - America/Chicago
      - America/Denver
      - America/Los_Angeles
      - America/Sao_Paulo
    on_value:
      - script.execute:
          id: aquaclean_apply_timezone
          index: !lambda "return i;"
