                tz.dst_start = {10800, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
                tz.dst_end = {14400, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 28:  // Europe/Sofia: EET-2EEST,M3.5.0/3,M10.5.0/4
                tz.std_offset_seconds = -7200;
                tz.dst_offset_seconds = -10800;
                tz.dst_start = {10800, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
                tz.dst_end = {14400, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 29:  // Europe/Athens: EET-2EEST,M3.5.0/3,M10.5.0/4
                tz.std_offset_seconds = -7200;
                tz.dst_offset_seconds = -10800;
                tz.dst_start = {10800, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
                tz.dst_end = {14400, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 30:  // Europe/Istanbul: <+03>-3
                tz.std_offset_seconds = -10800;
                tz.dst_offset_seconds = 0;
                tz.dst_start = {0, 0, esphome::time::DSTRuleType::NONE, 0, 0, 0};
                tz.dst_end = {0, 0, esphome::time::DSTRuleType::NONE, 0, 0, 0};
