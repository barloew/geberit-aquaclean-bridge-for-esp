                tz.dst_end = {10800, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 14:  // Europe/Oslo: CET-1CEST,M3.5.0,M10.5.0/3
                tz.std_offset_seconds = -3600;
                tz.dst_offset_seconds = -7200;
                tz.dst_start = {7200, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
