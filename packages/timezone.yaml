substitutions:
  tz_label: Time zone
  tz_default: Europe/Amsterdam

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute:
            id: aquaclean_apply_timezone
            index: !lambda 'return id(aquaclean_timezone).active_index().value_or(0);'

script:
  - id: aquaclean_apply_timezone
    parameters:
      index: int
    then:
      - lambda: |-
          esphome::time::ParsedTimezone tz{};
          switch (index) {
              case 0:  // UTC: UTC0
                tz.std_offset_seconds = 0;
                tz.dst_offset_seconds = 0;
                tz.dst_start = {0, 0, esphome::time::DSTRuleType::NONE, 0, 0, 0};
                tz.dst_end = {0, 0, esphome::time::DSTRuleType::NONE, 0, 0, 0};
                break;
              case 1:  // Europe/London: GMT0BST,M3.5.0/1,M10.5.0
                tz.std_offset_seconds = 0;
                tz.dst_offset_seconds = -3600;
                tz.dst_start = {3600, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
                tz.dst_end = {7200, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 2:  // Europe/Dublin: IST-1GMT0,M10.5.0,M3.5.0/1
                tz.std_offset_seconds = -3600;
                tz.dst_offset_seconds = 0;
                tz.dst_start = {7200, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                tz.dst_end = {3600, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
                break;
              case 3:  // Europe/Lisbon: WET0WEST,M3.5.0/1,M10.5.0
                tz.std_offset_seconds = 0;
                tz.dst_offset_seconds = -3600;
                tz.dst_start = {3600, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
                tz.dst_end = {7200, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 4:  // Europe/Amsterdam: CET-1CEST,M3.5.0,M10.5.0/3
                tz.std_offset_seconds = -3600;
                tz.dst_offset_seconds = -7200;
                tz.dst_start = {7200, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
                tz.dst_end = {10800, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 5:  // Europe/Brussels: CET-1CEST,M3.5.0,M10.5.0/3
                tz.std_offset_seconds = -3600;
                tz.dst_offset_seconds = -7200;
                tz.dst_start = {7200, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
                tz.dst_end = {10800, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 6:  // Europe/Luxembourg: CET-1CEST,M3.5.0,M10.5.0/3
                tz.std_offset_seconds = -3600;
                tz.dst_offset_seconds = -7200;
                tz.dst_start = {7200, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
                tz.dst_end = {10800, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 7:  // Europe/Paris: CET-1CEST,M3.5.0,M10.5.0/3
                tz.std_offset_seconds = -3600;
                tz.dst_offset_seconds = -7200;
                tz.dst_start = {7200, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 3, 5, 0};
                tz.dst_end = {10800, 0, esphome::time::DSTRuleType::MONTH_WEEK_DAY, 10, 5, 0};
                break;
              case 8:  // Europe/Berlin: CET-1CEST,M3.5.0,M10.5.0/3
                tz.std_offset_seconds = -3600;
                tz.dst_offset_seconds = -7200;
