select:
  - platform: template
    id: aquaclean_timezone
    name: ${tz_label}
    icon: mdi:map-clock
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: ${tz_default}
    web_server:
      sorting_group_id: aquaclean_web_bridge
      sorting_weight: 95
    options:
      - UTC
      - Europe/London
      - Europe/Dublin
      - Europe/Lisbon
      - Europe/Amsterdam
      - Europe/Brussels
      - Europe/Luxembourg
      - Europe/Paris
      - Europe/Berlin
