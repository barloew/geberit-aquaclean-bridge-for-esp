<svg xmlns="http://www.w3.org/2000/svg" width="280" height="230" viewBox="0 0 280 230" role="img" aria-label="Step 3: Choose your board">
  <style>
    .box   { fill:#ffffff; stroke:#d0d7de; }
    .chip  { fill:#2f81f7; fill-opacity:.12; }
    .icon  { stroke:#2f81f7; }
    .sub   { font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; letter-spacing:.08em; fill:#2f81f7; }
    .title { font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill:#1f2328; }
    .text  { font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill:#59636e; }
    @media (prefers-color-scheme: dark) {
      .box   { fill:#0d1117; stroke:#3d444d; }
      .chip  { fill-opacity:.22; }
      .title { fill:#f0f6fc; }
      .text  { fill:#9198a1; }
    }
  </style>
  <rect class="box" x="1" y="1" width="278" height="228" rx="16" stroke-width="1.5"/>
  <rect class="chip" x="24" y="24" width="44" height="44" rx="11"/>
  <g class="icon" transform="translate(34 34)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20v2" />
    <path d="M12 2v2" />
    <path d="M17 20v2" />
    <path d="M17 2v2" />
    <path d="M2 12h2" />
    <path d="M2 17h2" />
    <path d="M2 7h2" />
    <path d="M20 12h2" />
    <path d="M20 17h2" />
    <path d="M20 7h2" />
    <path d="M7 20v2" />
    <path d="M7 2v2" />
    <rect x="4" y="4" width="16" height="16" rx="2" />
    <rect x="8" y="8" width="8" height="8" rx="1" />
  </g>
  <text x="24" y="94" class="sub">STEP 3</text>
  <text x="24" y="120" class="title">Choose your board</text>
  <text x="24" y="145" class="text">A dedicated ESP32-S3 with at</text>
  <text x="24" y="163" class="text">least 8 MB flash, such as the</text>
  <text x="24" y="181" class="text">M5Stack AtomS3 Lite.</text>
</svg>
