<svg xmlns="http://www.w3.org/2000/svg" width="280" height="230" viewBox="0 0 280 230" role="img" aria-label="Step 4: Choose your route">
  <style>
    .box   { fill:#ffffff; stroke:#d0d7de; }
    .chip  { fill:#2f81f7; fill-opacity:.12; }
    .icon  { stroke:#2f81f7; }
    .sub   { font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; letter-spacing:.08em; fill:#2f81f7; }
    .title { font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill:#1f2328; }
    .text  { font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill:#59636e; }
    @media (prefers-color-scheme: dark) {
      .box   { fill:#0d1117; stroke:#3d444d; }
      .chip  { fill-opacity:.22; }
      .title { fill:#f0f6fc; }
      .text  { fill:#9198a1; }
    }
  </style>
  <rect class="box" x="1" y="1" width="278" height="228" rx="16" stroke-width="1.5"/>
  <rect class="chip" x="24" y="24" width="44" height="44" rx="11"/>
  <g class="icon" transform="translate(34 34)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 3h5v5" />
    <path d="M8 3H3v5" />
    <path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3" />
    <path d="m15 9 6-6" />
  </g>
  <text x="24" y="94" class="sub">STEP 4</text>
  <text x="24" y="120" class="title">Choose your route</text>
  <text x="24" y="145" class="text">Native API for Home Assistant, or</text>
  <text x="24" y="163" class="text">MQTT for any home automation</text>
  <text x="24" y="181" class="text">system.</text>
</svg>
